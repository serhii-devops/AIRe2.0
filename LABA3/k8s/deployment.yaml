# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: default
  labels:
    app: sre-agent
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent
  template:
    metadata:
      labels:
        app: sre-agent
    spec:
      serviceAccountName: sre-agent   # Привязка к SA с RBAC

      # Не запускаем от root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: sre-agent
          image: your-registry/sre-agent:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env:
            - name: AGENT_BASE_URL
              value: "http://sre-agent.default.svc.cluster.local"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: SERVICE_NAME
              value: "sre-k8s-agent"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: ENVIRONMENT
              value: "production"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          # Запрет эскалации привилегий
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
