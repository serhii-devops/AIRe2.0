replicaCount: 2

image:
  repository: registry.gitlab.example.com/myteam/a2a-agent
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: a2a-agent.example.com
  tls:
    enabled: true
    secretName: a2a-agent-tls   # cert-manager управляет

env:
  AGENT_URL: "https://a2a-agent.example.com"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi