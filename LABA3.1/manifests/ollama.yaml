apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: kagent-system
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: ollama-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: kagent-system
  labels:
    app: ollama
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
  selector:
    app: ollama
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-model
  namespace: kagent-system
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull-model
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Ollama to be ready..."
              until curl -s http://ollama.kagent-system.svc.cluster.local:11434/api/tags > /dev/null; do
                sleep 5
              done
              echo "Pulling llama3 model..."
              curl -X POST http://ollama.kagent-system.svc.cluster.local:11434/api/pull \
                -H "Content-Type: application/json" \
                -d '{"name": "llama3"}'
              echo "Model pulled successfully"
